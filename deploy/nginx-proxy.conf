# /etc/nginx/sri-agent-proxy.conf
#
#   sudo cp deploy/nginx-proxy.conf /etc/nginx/sri-agent-proxy.conf
#
# Ajustes compartidos por los dos locations que van al agente.
# Lo importante de este archivo es el bloque de SSE: sin él la UI se queda
# esperando para siempre, porque nginx bufferea la respuesta y los eventos
# del stream nunca llegan al navegador.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ── Server-Sent Events ──────────────────────────────────────────────────────
# El stream de sesión (GET /eve/v1/session/:id/stream) es SSE.

# nginx bufferea las respuestas del upstream por defecto: hay que apagarlo o
# los eventos se acumulan y la UI parece colgada.
proxy_buffering off;
proxy_cache off;

# Con HTTP/1.1 nginx manda "Connection: close" al upstream salvo que se limpie.
proxy_set_header Connection "";

# La conexión queda abierta mucho tiempo. Con el valor por defecto (60s) nginx
# la corta y el cliente reconecta cada minuto sin necesidad.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
