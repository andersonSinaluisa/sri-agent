# /etc/nginx/sites-available/sri-agent
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sri-agent
#   sudo sed -i "s/sri.tu-dominio.com/TU-DOMINIO-REAL/" /etc/nginx/sites-available/sri-agent
#   sudo ln -sf /etc/nginx/sites-available/sri-agent /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, el certificado:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d TU-DOMINIO-REAL
#
# certbot reescribe este archivo agregando el bloque 443 y el redirect desde
# el 80. No hace falta que lo escribas a mano.

server {
    listen 80;
    listen [::]:80;
    server_name agent-sri.brix-dev.com;

    # La UI compilada. Es una SPA: cualquier ruta que no sea un archivo cae
    # en index.html.
    root /srv/sri-agent/web/dist;
    index index.html;

    # Adjuntos: eve acepta PDFs de hasta 20 MB.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── El agente ───────────────────────────────────────────────────────────
    # Los DOS prefijos tienen que llegar SIN reescribir la ruta. Un proxy que
    # solo pasa /eve/ deja arrancar una sesión, pero el run se cuelga cuando el
    # callback de workflow no puede volver.
    #
    # OJO con proxy_pass: va SIN barra ni ruta al final. Si escribís
    # `proxy_pass http://127.0.0.1:3000/;` nginx reemplaza el prefijo del
    # location y el agente recibe la URL equivocada.

    location ^~ /eve/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/sri-agent-proxy.conf;
    }

    location ^~ /.well-known/workflow/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/sri-agent-proxy.conf;
    }

    # ── La UI ───────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Corta el bucle de redirección interna cuando falta el build. Sin esto,
    # un web/dist inexistente o ilegible da "500 Internal Server Error" y
    # "rewrite or internal redirection cycle" en el error.log. Con esto da un
    # 404 honesto que apunta al problema real: falta compilar la UI.
    location = /index.html {
        try_files $uri =404;
    }

    # Sin esto, un pedido de favicon devuelve el index.html entero y ensucia
    # el log en cada visita.
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # Los assets con hash en el nombre son inmutables.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
