# Despliegue del agente SRI en el VPS.
#
# El trabajo pesado NO vive acá: lo hace `deploy/deploy.sh` en el servidor,
# que ya sabe construir, verificar la salud y volver al build anterior si algo
# falla. Este flujo solo decide CUÁNDO correrlo y se asegura de que las
# pruebas pasen antes.
#
# Las credenciales del SRI nunca pasan por GitHub. Viven en /etc/sri-agent/env
# en el servidor y este flujo no las lee, ni las escribe, ni las necesita.
name: Desplegar

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Volver al build anterior en vez de desplegar"
        type: boolean
        default: false

# Un despliegue a la vez. Dos corridas pisándose dejan el servidor a mitad de
# camino, así que la nueva espera; no se cancela la que está en curso.
concurrency:
  group: despliegue-vps
  cancel-in-progress: false

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    # Un rollback no construye nada nuevo: hacerlo esperar a las pruebas del
    # código actual no tiene sentido, y suele correrse con algo roto.
    if: ${{ !inputs.rollback }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Las pruebas no abren ningún navegador: importan los módulos de
      # Playwright pero nunca lo lanzan. Bajar los binarios serían minutos por
      # corrida a cambio de nada.
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Tipos, selectores, mapa del 104, formato de casilleros, lectura del
      # listado, clasificación de compras y liquidación.
      - name: Pruebas
        run: npm test

  desplegar:
    name: Desplegar en el VPS
    runs-on: ubuntu-latest
    needs: [pruebas]
    # `always()` deja pasar el rollback, que se salta las pruebas. Un fallo de
    # pruebas sigue bloqueando el despliegue normal.
    if: ${{ always() && (inputs.rollback || needs.pruebas.result == 'success') }}
    # Definí este entorno en Settings > Environments para exigir aprobación
    # manual antes de cada despliegue.
    environment: produccion

    steps:
      # Sin acción de terceros para el SSH: una dependencia más con acceso a
      # la clave del servidor, a cambio de ahorrar diez líneas.
      - name: Preparar el acceso SSH
        env:
          CLAVE: ${{ secrets.VPS_SSH_KEY }}
          HOSTS_CONOCIDOS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${HOSTS_CONOCIDOS:-}" ]; then
            echo "Falta el secreto VPS_KNOWN_HOSTS." >&2
            echo "Generalo con: ssh-keyscan -p 22 TU_HOST" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          # Se fija la huella del servidor en vez de aceptar la que venga.
          # Con StrictHostKeyChecking=no, cualquiera que se interponga recibe
          # la clave de despliegue sin que nada lo note.
          printf '%s\n' "$HOSTS_CONOCIDOS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          PUERTO: ${{ secrets.VPS_PORT || '22' }}
          DIRECTORIO: ${{ vars.VPS_APP_DIR || '/srv/sri-agent' }}
          ROLLBACK: ${{ inputs.rollback && '--rollback' || '' }}
        run: |
          set -euo pipefail
          # `sudo -n`: sin pedir contraseña. Si el usuario de despliegue no la
          # tiene concedida, falla acá y no a mitad del despliegue.
          ssh -i ~/.ssh/id_despliegue -p "$PUERTO" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$USUARIO@$HOST" \
              "sudo -n bash '$DIRECTORIO/deploy/deploy.sh' $ROLLBACK"

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/id_despliegue
